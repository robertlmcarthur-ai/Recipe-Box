<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipe Box">
<title>Recipe Box</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#222;--muted:#777;--accent:#8a4b2a;--line:#e6e4df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);z-index:5}
h1{margin:0 0 10px;font-size:20px;font-weight:600}
.search{display:flex;gap:8px}
input[type=search]{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;min-height:46px}
button{font:inherit;min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;touch-action:manipulation}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
#versions{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.vbtn{white-space:nowrap;min-height:38px;padding:8px 12px;font-size:14px;border-radius:99px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.vbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#status{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
main{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}
#recs{display:grid;gap:8px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rec .role{font-size:12px;color:var(--muted);letter-spacing:.04em}
.rec a.name{display:block;font-size:18px;font-weight:600;color:var(--ink);text-decoration:underline;margin-top:2px}
.rec .none{color:var(--muted);font-size:15px}
#detail{scroll-margin-top:170px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.detail h2{font-size:20px;margin:0 0 4px;font-weight:600}
.meta{font-size:14px;color:var(--muted);margin-bottom:10px}
.meta a{color:var(--accent)}
.vlabel{display:inline-block;font-size:13px;color:var(--accent);margin-bottom:4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px;font-weight:600}
ul,ol{margin:0;padding-left:22px}
li{margin:4px 0}
.copy{margin-top:14px;width:100%}
footer{font-size:13px;color:var(--muted);margin-top:32px;text-align:center}
@media (min-width:720px){#recs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Recipe Box</h1>
  <div class="search">
    <input id="q" type="search" placeholder="What do you want to cook?" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="versions"></div>
  <div id="status"></div>
</header>

<main>
  <div class="label">Recommended for you</div>
  <div id="recs"></div>
  <div id="detail"></div>
  <footer>Recipes are drafted from general knowledge. Check ingredients and labels before cooking, especially for allergies or dietary needs.</footer>
</main>

<script>
const VERSION_BUTTONS=[["base","Original"],["maddie","Maddie - Gluten Free"],["molly","Molly - Gluten, dairy and nut free"],["keto","Keto"]];
const ROLE_LABEL={main:"Main meal",side:"Side dish",appetizer:"Appetizer",bread:"Bread / baking"};
const VERSION_NAME={base:"Original",maddie:"Maddie - Gluten Free",molly:"Molly - Gluten, dairy and nut free",keto:"Keto"};

/* Each recipe: id, name, role, source, status, and versions {base, maddie, molly, keto}, each with i (ingredients), s (steps), p (shopping list). "Same as base." expands to the Original list. */
const RECIPES=[
{id:"RB-001",name:"Loaded Smashed Potatoes",role:"side",source:"https://www.dontgobaconmyheart.co.uk/loaded-smashed-potatoes/",v:{
base:{i:["20 baby potatoes (about 1.3–1.5 lb), similar size","2 tsp salt for the boiling water, plus 1/4–1/2 tsp for seasoning","6 slices bacon","2 tbsp olive oil","1/2 tsp smoked paprika","1/2 tsp garlic powder","1/4 tsp black pepper","4 oz cheddar, grated (about 1 cup)","1/2 cup sour cream, or to taste","1–2 green onions, thinly sliced","A handful of pickled jalapeños, finely diced"],s:["Put the potatoes in a large pot, cover with cold water, add 2 tsp salt, and bring to a boil. Cook until fork-tender, 20–25 min.","Drain and steam dry 5 min. Heat the oven to 390°F.","Toss the potatoes with olive oil, smoked paprika, garlic powder, salt and pepper. Spread on parchment-lined sheet pans and press each flat. Steam another 5 min.","Brush leftover oil mixture over the potatoes, top with cheddar, and bake 30–35 min until deep golden and charred at the edges.","Cook the bacon on its own sheet pan or in a skillet, then crumble.","Rest a few minutes, then top with sour cream, bacon, green onion and jalapeños."],p:["Baby potatoes (1.5 lb)","Bacon (6 slices)","Olive oil","Smoked paprika","Garlic powder","Black pepper","Cheddar, 4 oz","Sour cream, 1/2 cup","Green onions","Pickled jalapeños"]},
maddie:{i:["Same as base. Confirm the bacon and spice blends are labeled gluten-free."],s:["Same as base."],p:["Same as base"]},
molly:{i:["20 baby potatoes, 2 tsp salt for the water, plus 1/4–1/2 tsp for seasoning","6 slices bacon (check the label for gluten and nuts)","2 tbsp olive oil, 1/2 tsp smoked paprika, 1/2 tsp garlic powder, 1/4 tsp black pepper (check spice labels)","4 oz nut-free dairy-free shredded cheddar-style cheese (e.g. Violife)","1/2 cup nut-free dairy-free sour cream (e.g. Tofutti Sour Supreme; avoid cashew or almond bases)","1–2 green onions, pickled jalapeños (check label for gluten)"],s:["Boil the potatoes in cold salted water (2 tsp salt) until fork-tender, 20–25 min.","Drain and steam dry 5 min. Heat the oven to 390°F.","Toss with olive oil, smoked paprika, garlic powder, salt and pepper. Spread on parchment-lined sheet pans, press flat, and steam 5 min more.","Brush leftover oil mixture over the potatoes and top with the dairy-free shred. Bake 30–35 min until golden and charred at the edges. Dairy-free shred melts less, so watch for a crisp edge.","Cook the bacon on its own sheet pan or in a skillet, then crumble.","Rest a few minutes, then top with dairy-free sour cream, bacon, green onion and jalapeños."],p:["Baby potatoes, bacon, olive oil, smoked paprika, garlic powder, black pepper","Nut-free dairy-free shredded cheese (e.g. Violife)","Nut-free dairy-free sour cream (e.g. Tofutti Sour Supreme)","Green onions, pickled jalapeños"]},
keto:{i:["1.5 lb radishes, or 1 head cauliflower in large florets, in place of the potatoes","Olive oil, smoked paprika, garlic powder, salt and pepper, as in base","Full topping set from base: cheddar, bacon, sour cream, green onion, jalapeños"],s:["Boil radishes 10–12 min, or cauliflower 6–8 min, in salted water until just tender.","Drain and pat very dry. Heat the oven to 390°F.","Smash each piece on a parchment-lined sheet pan, toss with oil and seasonings.","Top with cheddar and bake 25–30 min until golden and crisp at the edges.","Cook the bacon, crumble, and finish with sour cream, green onion and jalapeños."],p:["Radishes (1.5 lb) or 1 head cauliflower","Cheddar, bacon, sour cream, green onions, pickled jalapeños","Olive oil, smoked paprika, garlic powder"]}}},
{id:"RB-002",name:"Rosemary Garlic Focaccia Muffins",role:"bread",source:"https://saltnsprinkles.com/rosemary-garlic-focaccia-muffins/#recipe",v:{
base:{i:["1¼ tsp active dry or instant yeast","1 tsp honey","1¼ cups warm water","2½ cups bread flour (all-purpose works, a little less chewy)","2 tsp sea salt","¼ cup extra-virgin olive oil, divided, plus more for the pan and hands","2 tbsp butter, melted","2 tbsp flaky finishing salt","Topping: ⅓ cup extra-virgin olive oil, 2–3 sprigs fresh rosemary (minced), 3 garlic cloves (minced)"],s:["Day one: stir yeast, honey and warm water; let sit 5–10 min until foamy.","Add the flour and sea salt; stir until a shaggy, wet dough forms.","Drizzle 2 tbsp oil over the dough, cover, and refrigerate 8–12 hr until doubled (or 4+ hr at room temperature).","Day two: drizzle the remaining 2 tbsp oil and knead briefly in the bowl to deflate.","Pat into a rectangle, cut in half, then cut each half into 6 pieces (12 total).","Oil a 12-cup muffin pan, press one piece into each cup, cover, and rise about 2 hr.","Heat ⅓ cup oil over medium heat until it shimmers. Off the heat, add rosemary and garlic and swirl about 1 min.","Heat the oven to 450°F (regular bake, not convection).","Oil your fingers, dimple each piece deeply, and spoon the rosemary-garlic oil over the tops.","Bake about 20 min until golden. Brush hot muffins with melted butter and sprinkle with finishing salt."],p:["Active dry or instant yeast","Honey","Bread flour, 2½ cups","Sea salt","Extra-virgin olive oil, about 1 cup","Butter, 2 tbsp","Flaky finishing salt","Fresh rosemary, 2–3 sprigs","Garlic, 3 cloves"]},
maddie:{i:["Same gluten-free flour as Molly, with the rest of the base recipe. Keep the real butter."],s:["Same as Molly steps, finishing with melted real butter and flaky salt."],p:["Gluten-free bread flour blend, yeast, honey, sea salt, olive oil, butter, rosemary, garlic, flaky salt"]},
molly:{i:["2½ cups gluten-free bread flour blend with xanthan gum or psyllium (e.g. King Arthur Gluten-Free Bread Flour)","1¼ tsp yeast, 1 tsp honey, 1¼ cups warm water, 2 tsp sea salt","¼ cup olive oil plus ⅓ cup for topping","2 tbsp nut-free vegan butter (e.g. Earth Balance Original), melted","2 tbsp flaky finishing salt, 2–3 sprigs rosemary, 3 garlic cloves"],s:["Stir yeast, honey and warm water; rest 5–10 min.","Add gluten-free flour, salt and 2 tbsp oil into a thick batter.","Cover and rest 1 hr in a warm spot until bubbly.","Oil a 12-cup muffin pan and scoop batter evenly into cups. No cutting.","Rise 45–60 min until puffed.","Heat ⅓ cup oil with rosemary and garlic as in base.","Heat the oven to 450°F.","Dimple tops, spoon oil over, and bake 20–25 min until golden.","Brush with melted nut-free vegan butter and sprinkle with flaky salt."],p:["Gluten-free bread flour blend, yeast, honey, sea salt","Olive oil, nut-free vegan butter (e.g. Earth Balance Original)","Fresh rosemary, garlic, flaky salt"]},
keto:{i:["2 cups shredded mozzarella, 2 oz cream cheese","1½ cups almond flour, 2 eggs, 1 tsp baking powder","Rosemary-garlic oil: ⅓ cup olive oil, 2–3 sprigs rosemary, 3 garlic cloves","Butter and flaky salt to finish"],s:["Heat the oven to 375°F. Grease a 12-cup muffin pan.","Melt mozzarella and cream cheese in short bursts, stirring until smooth.","Stir in almond flour, eggs and baking powder until a soft dough forms.","Divide among the 12 cups, press in, and dimple.","Spoon rosemary-garlic oil over the tops.","Bake 15–18 min until golden. Brush with melted butter and sprinkle with flaky salt."],p:["Shredded mozzarella (2 cups), cream cheese (2 oz), almond flour (1½ cups), eggs, baking powder","Olive oil, fresh rosemary, garlic, butter, flaky salt"]}}},
{id:"RB-003",name:"Creamy Lemon Garlic Chicken",role:"main",source:"https://whatsmomcookin.com/creamy-lemon-garlic-chicken/",v:{
base:{i:["4 to 6 thin-cut boneless skinless chicken breasts (about 1½ lb)","Lemon pepper seasoning, garlic powder, onion powder, smoked paprika (about 1 tsp each to start; estimate)","1 Tbsp avocado oil","5 Tbsp salted butter, divided","7 to 8 garlic cloves, minced","¼ cup all-purpose flour","2 cups chicken broth","1 cup heavy cream","¼ cup freshly grated Parmesan, plus more for serving","Juice of 1 lemon","1 lemon, sliced","1 to 2 tsp chopped fresh parsley"],s:["Season the chicken generously with lemon pepper, garlic powder, onion powder, and smoked paprika.","Heat avocado oil and 1 Tbsp butter in a large skillet over medium heat. Sear the chicken 3–4 min per side. Set aside.","Add remaining butter and garlic; cook 1–2 min until fragrant.","Stir in flour and about ¼ tsp each of the seasonings; cook about 3 min.","Slowly whisk in broth until smooth, then stir in cream. Simmer several minutes until thick.","Stir in Parmesan and lemon juice.","Return chicken, spoon sauce over it, top each piece with a lemon slice. Cover and cook on low about 10 min until 165°F.","Garnish with parsley and extra Parmesan. Serve over mashed potatoes or rice with garlic green beans."],p:["Chicken breasts, 1½ lb","Lemon pepper seasoning, garlic powder, onion powder, smoked paprika","Avocado oil","Salted butter, 1 stick","Garlic, 1 head","All-purpose flour","Chicken broth, 32 oz","Heavy cream, 8 oz","Parmesan wedge, about 4 oz","Lemons, 2","Fresh parsley, 1 small bunch"]},
keto:{i:["Flour → omit; whisk ⅛ tsp xanthan gum into the broth (estimate; add a pinch more if thin)","Chicken broth → low-carb or sugar-free broth (check labels)"],s:["Same as base, skipping flour.","Serve over cauliflower mash instead of potatoes or rice."],p:["Base shopping list, minus flour","Xanthan gum, small jar","Low-carb or sugar-free chicken broth, 32 oz","Cauliflower, 1 head"]},
maddie:{i:["Flour → 2 Tbsp cornstarch in ¼ cup cold broth, or ¼ cup 1-to-1 gluten-free flour blend","Chicken broth → certified gluten-free broth","Check seasoning labels for gluten","Everything else stays the same, including butter, cream and Parmesan"],s:["Same as base."],p:["Base shopping list, with cornstarch or gluten-free flour blend in place of flour","Gluten-free chicken broth"]},
molly:{i:["Butter → 5 Tbsp dairy-free buttery spread (check label for nut-free)","Flour → 2 Tbsp cornstarch whisked into ¼ cup cold broth","Chicken broth → 2 cups certified gluten-free, dairy-free broth","Heavy cream → 1 cup full-fat canned coconut cream","Parmesan → 2 to 3 Tbsp nutritional yeast","Check lemon pepper, garlic powder, onion powder, smoked paprika labels for gluten and nuts"],s:["Same as base, skipping the flour step.","Whisk the cornstarch slurry into the broth at the sauce step, then simmer until thick.","Coconut cream thickens less, so simmer a few minutes longer.","Serve over dairy-free mashed potatoes."],p:["Chicken breasts, 1½ lb","Seasonings (checked for gluten and nuts)","Avocado oil","Dairy-free buttery spread, 1 tub","Garlic, 1 head","Cornstarch, small bag","Gluten-free, dairy-free broth, 32 oz","Full-fat coconut cream, 13.5 oz can","Nutritional yeast","Lemons, 2","Fresh parsley"]}}},
{id:"RB-004",name:"Sheet-Pan Honey Garlic Salmon",role:"main",source:"",v:{
base:{i:["4 salmon fillets (about 6 oz each)","3 Tbsp honey","3 Tbsp soy sauce","2 Tbsp olive oil, divided","3 garlic cloves, minced","1 tsp grated fresh ginger","1 lb broccoli florets","1/2 tsp salt, 1/4 tsp black pepper","2 green onions, sliced","1 Tbsp sesame seeds (optional)"],s:["Heat the oven to 425°F and line a sheet pan with foil.","Whisk honey, soy sauce, garlic, ginger and 1 Tbsp oil. Set half aside for brushing.","Toss broccoli with 1 Tbsp oil, salt and pepper. Spread on one side of the pan and roast 8 min.","Season salmon and place skin-side down on the other side. Brush with glaze.","Roast 10–12 min until salmon flakes and reaches 145°F.","Brush with remaining glaze; top with green onion and sesame seeds."],p:["Salmon, 4 fillets","Honey","Soy sauce","Garlic","Fresh ginger","Broccoli, 1 lb","Olive oil","Green onions","Sesame seeds (optional)"]},
keto:{i:["4 salmon fillets (about 6 oz each)","2 Tbsp sugar-free honey-style syrup (instead of honey)","3 Tbsp soy sauce","2 Tbsp olive oil, divided","3 garlic cloves, minced","1 tsp grated fresh ginger","1 lb broccoli florets","1/2 tsp salt, 1/4 tsp black pepper","2 green onions, sliced","1 Tbsp sesame seeds (optional)"],s:["Same as base."],p:["Salmon, 4 fillets","Sugar-free honey-style syrup","Soy sauce","Garlic","Fresh ginger","Broccoli, 1 lb","Olive oil","Green onions","Sesame seeds (optional)"]},
maddie:{i:["4 salmon fillets (about 6 oz each)","3 Tbsp honey","3 Tbsp gluten-free tamari (instead of soy sauce)","2 Tbsp olive oil, divided","3 garlic cloves, minced","1 tsp grated fresh ginger","1 lb broccoli florets","1/2 tsp salt, 1/4 tsp black pepper","2 green onions, sliced","1 Tbsp sesame seeds (optional)"],s:["Same as base."],p:["Salmon, 4 fillets","Honey","Gluten-free tamari","Garlic","Fresh ginger","Broccoli, 1 lb","Olive oil","Green onions","Sesame seeds (optional)"]},
molly:{i:["4 salmon fillets (about 6 oz each)","3 Tbsp honey","3 Tbsp coconut aminos (instead of soy sauce)","2 Tbsp olive oil, divided","3 garlic cloves, minced","1 tsp grated fresh ginger","1 lb broccoli florets","1/2 tsp salt, 1/4 tsp black pepper","2 green onions, sliced","1 Tbsp sesame seeds (optional)"],s:["Same as base."],p:["Salmon, 4 fillets","Honey","Coconut aminos","Garlic","Fresh ginger","Broccoli, 1 lb","Olive oil","Green onions","Sesame seeds (optional)"]}}},
{id:"RB-005",name:"Beef and Broccoli Stir-Fry",role:"main",source:"",v:{
base:{i:["1 lb flank steak, thinly sliced against the grain","1 Tbsp cornstarch (for the beef)","2 Tbsp vegetable oil, divided","1 lb broccoli florets","3 garlic cloves, minced","1 tsp grated fresh ginger","1/3 cup beef broth","1/4 cup soy sauce","2 Tbsp brown sugar","1 Tbsp oyster sauce (optional)","1 tsp cornstarch mixed with 2 Tbsp water (slurry)","Cooked rice to serve"],s:["Toss beef with 1 Tbsp cornstarch; rest 10 min.","Sear beef in 1 Tbsp oil over high heat in batches; set aside.","Add broccoli and 2 Tbsp water; cover 2 min until bright green. Remove.","Add remaining oil, garlic and ginger; cook 30 sec.","Stir in broth, soy sauce, brown sugar and oyster sauce; simmer 1 min. Stir in slurry until thick.","Return beef and broccoli; toss 1 min. Serve over rice."],p:["Flank steak, 1 lb","Cornstarch","Vegetable oil","Broccoli, 1 lb","Garlic","Fresh ginger","Beef broth, small carton","Soy sauce","Brown sugar","Oyster sauce (optional)","Rice"]},
keto:{i:["1 lb flank steak, thinly sliced against the grain","1 tsp xanthan gum (instead of cornstarch, for the beef and sauce)","2 Tbsp vegetable oil, divided","1 lb broccoli florets","3 garlic cloves, minced","1 tsp grated fresh ginger","1/3 cup beef broth","1/4 cup soy sauce","1 Tbsp sugar-free sweetener (instead of brown sugar)","1 Tbsp oyster sauce (optional)","Cauliflower rice to serve"],s:["Same as base; thicken the sauce with xanthan gum instead of cornstarch slurry, a pinch at a time."],p:["Flank steak, 1 lb","Xanthan gum","Vegetable oil","Broccoli, 1 lb","Garlic","Fresh ginger","Beef broth","Soy sauce","Sugar-free sweetener","Oyster sauce (optional)","Cauliflower rice"]},
maddie:{i:["1 lb flank steak, thinly sliced against the grain","1 Tbsp cornstarch (for the beef)","2 Tbsp vegetable oil, divided","1 lb broccoli florets","3 garlic cloves, minced","1 tsp grated fresh ginger","1/3 cup gluten-free beef broth","1/4 cup gluten-free tamari (instead of soy sauce)","2 Tbsp brown sugar","1 Tbsp gluten-free oyster sauce (check label)","1 tsp cornstarch mixed with 2 Tbsp water (slurry)","Cooked rice to serve"],s:["Same as base."],p:["Flank steak, 1 lb","Cornstarch","Vegetable oil","Broccoli, 1 lb","Garlic","Fresh ginger","Gluten-free beef broth","Gluten-free tamari","Brown sugar","Gluten-free oyster sauce","Rice"]},
molly:{i:["1 lb flank steak, thinly sliced against the grain","1 Tbsp cornstarch (for the beef)","2 Tbsp vegetable oil, divided","1 lb broccoli florets","3 garlic cloves, minced","1 tsp grated fresh ginger","1/3 cup beef broth (check label: dairy-free, gluten-free)","1/4 cup coconut aminos (instead of soy sauce)","2 Tbsp brown sugar","Oyster sauce omitted (or a check-labelled gluten-free version)","1 tsp cornstarch mixed with 2 Tbsp water (slurry)","Cooked rice to serve"],s:["Same as base."],p:["Flank steak, 1 lb","Cornstarch","Vegetable oil","Broccoli, 1 lb","Garlic","Fresh ginger","Beef broth (gluten-free, dairy-free)","Coconut aminos","Brown sugar","Rice"]}}},
{id:"RB-006",name:"Turkey Taco Skillet",role:"main",source:"",v:{
base:{i:["1 lb ground turkey","1 small onion, diced","2 garlic cloves, minced","1 Tbsp taco seasoning (or 1 tsp chili powder, 1 tsp cumin, 1/2 tsp paprika, 1/2 tsp salt)","1 can (15 oz) black beans, drained","1 can (14.5 oz) diced tomatoes","1/2 cup water or broth","1 cup corn (frozen is fine)","1 cup shredded cheddar","Toppings: sour cream, avocado, cilantro, lime"],s:["Brown turkey with onion in a large skillet over medium-high; drain excess fat.","Add garlic and seasoning; cook 1 min.","Stir in beans, tomatoes and water; simmer 8 min.","Stir in corn; top with cheese and cover 2 min to melt.","Serve with toppings."],p:["Ground turkey, 1 lb","Onion","Garlic","Taco seasoning (or chili powder, cumin, paprika)","Black beans, 1 can","Diced tomatoes, 1 can","Corn, 1 cup","Shredded cheddar, 1 cup","Sour cream, avocado, cilantro, lime"]},
keto:{i:["1 lb ground turkey","1 small onion, diced","2 garlic cloves, minced","1 Tbsp taco seasoning (check for added sugar)","1 can (14.5 oz) diced tomatoes","1/2 cup water or broth","1/2 cup extra shredded cheddar","Serve over lettuce or cauliflower rice","Toppings: sour cream, avocado, cilantro, lime"],s:["Brown turkey with onion; drain fat.","Add garlic and seasoning; cook 1 min.","Add tomatoes and water; simmer 8 min.","Stir in cheese; spoon over lettuce or cauliflower rice; top."],p:["Ground turkey, 1 lb","Onion","Garlic","Taco seasoning (no added sugar)","Diced tomatoes, 1 can","Extra shredded cheddar","Lettuce or cauliflower rice","Sour cream, avocado, cilantro, lime"]},
maddie:{i:["1 lb ground turkey","1 small onion, diced","2 garlic cloves, minced","1 Tbsp gluten-free taco seasoning","1 can (15 oz) black beans, drained","1 can (14.5 oz) diced tomatoes","1/2 cup water or gluten-free broth","1 cup corn (frozen is fine)","1 cup shredded cheddar","Toppings: sour cream, avocado, cilantro, lime"],s:["Same as base."],p:["Ground turkey, 1 lb","Onion","Garlic","Gluten-free taco seasoning","Black beans, 1 can","Diced tomatoes, 1 can","Corn, 1 cup","Shredded cheddar","Sour cream, avocado, cilantro, lime"]},
molly:{i:["1 lb ground turkey","1 small onion, diced","2 garlic cloves, minced","1 Tbsp taco seasoning (check label: gluten-free, nut-free)","1 can (15 oz) black beans, drained","1 can (14.5 oz) diced tomatoes","1/2 cup water or broth","1 cup corn (frozen is fine)","1 cup nut-free dairy-free shredded cheese (e.g. Violife)","Toppings: nut-free dairy-free sour cream, avocado, cilantro, lime"],s:["Same as base."],p:["Ground turkey, 1 lb","Onion","Garlic","Taco seasoning (gluten-free, nut-free)","Black beans, 1 can","Diced tomatoes, 1 can","Corn, 1 cup","Nut-free dairy-free shredded cheese","Nut-free dairy-free sour cream, avocado, cilantro, lime"]}}},
{id:"RB-007",name:"Baked Turkey Meatballs with Marinara",role:"main",source:"",v:{
base:{i:["1 lb ground turkey","1/3 cup plain breadcrumbs","1/4 cup grated Parmesan","1 egg","1 garlic clove, minced","1 tsp Italian seasoning","1/2 tsp salt","1 jar (24 oz) marinara","8 oz spaghetti","Fresh basil (optional)"],s:["Heat oven to 400°F; line a sheet pan.","Mix turkey, breadcrumbs, Parmesan, egg, garlic, seasoning and salt. Form 16 meatballs.","Bake 18–20 min until 165°F.","Warm marinara; add meatballs and simmer 5 min.","Cook spaghetti; serve meatballs and sauce over pasta with basil."],p:["Ground turkey, 1 lb","Plain breadcrumbs","Parmesan wedge","Eggs","Garlic","Italian seasoning","Marinara, 24 oz jar","Spaghetti, 8 oz","Basil (optional)"]},
keto:{i:["1 lb ground turkey","1/4 cup almond flour (instead of breadcrumbs)","1/4 cup grated Parmesan","1 egg","1 garlic clove, minced","1 tsp Italian seasoning","1/2 tsp salt","1 jar (24 oz) sugar-free marinara","Zucchini noodles (2 medium zucchini) to serve","Fresh basil (optional)"],s:["Heat oven to 400°F; line a sheet pan.","Mix turkey, almond flour, Parmesan, egg, garlic, seasoning and salt. Form 16 meatballs.","Bake 18–20 min until 165°F.","Warm sugar-free marinara; add meatballs and simmer 5 min.","Sauté zucchini noodles 2 min; top with meatballs and sauce."],p:["Ground turkey, 1 lb","Almond flour","Parmesan wedge","Eggs","Garlic","Italian seasoning","Sugar-free marinara, 24 oz","Zucchini, 2 medium","Basil (optional)"]},
maddie:{i:["1 lb ground turkey","1/3 cup gluten-free breadcrumbs","1/4 cup grated Parmesan","1 egg","1 garlic clove, minced","1 tsp Italian seasoning","1/2 tsp salt","1 jar (24 oz) marinara (check label)","8 oz gluten-free pasta","Fresh basil (optional)"],s:["Same as base."],p:["Ground turkey, 1 lb","Gluten-free breadcrumbs","Parmesan wedge","Eggs","Garlic","Italian seasoning","Marinara, 24 oz jar","Gluten-free pasta, 8 oz","Basil (optional)"]},
molly:{i:["1 lb ground turkey","1/3 cup gluten-free, nut-free breadcrumbs","2 Tbsp nutritional yeast (instead of Parmesan)","1 egg","1 garlic clove, minced","1 tsp Italian seasoning","1/2 tsp salt","1 jar (24 oz) dairy-free, gluten-free marinara (check label)","8 oz gluten-free, dairy-free pasta","Fresh basil (optional)"],s:["Same as base."],p:["Ground turkey, 1 lb","Gluten-free breadcrumbs","Nutritional yeast","Eggs","Garlic","Italian seasoning","Dairy-free marinara, 24 oz","Gluten-free pasta, 8 oz","Basil (optional)"]}}},

const $=id=>document.getElementById(id);
let picks=null, defaultPicks=null, selectedId=null, version="base";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function versionFor(r,key){
  const base=r.v.base;
  const raw=(r.v[key]||base);
  const expand=(list,baseList)=>list.flatMap(x=>x==="Same as base."?baseList:[x]);
  return {i:raw.i,s:expand(raw.s,base.s),p:expand(raw.p,base.p)};
}

function renderVersionButtons(){
  $("versions").innerHTML=VERSION_BUTTONS.map(([k,l])=>`<button class="vbtn ${k===version?"on":""}" data-version="${k}">${esc(l)}</button>`).join("");
}

function pickDefault(){
  const pick=role=>{const pool=RECIPES.filter(r=>r.role===role);return pool.length?pool[Math.floor(Math.random()*pool.length)]:null};
  return {main:pick("main"),side:pick("side"),appetizer:pick("appetizer")};
}

function renderRecs(){
  if(!defaultPicks) defaultPicks=pickDefault();
  const p=picks||defaultPicks;
  const tile=(role,r)=>r
    ?`<div class="rec"><div class="role">${ROLE_LABEL[role]}</div><a class="name" href="#detail" data-open="${esc(r.id)}">${esc(r.name)}</a></div>`
    :`<div class="rec"><div class="role">${ROLE_LABEL[role]}</div><div class="none">No match yet</div></div>`;
  $("recs").innerHTML=tile("main",p.main)+tile("side",p.side)+tile("appetizer",p.appetizer);
}

function renderDetail(){
  const el=$("detail");
  const r=RECIPES.find(x=>x.id===selectedId);
  if(!r){el.innerHTML="";return}
  const v=versionFor(r,version);
  const ul=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const src=r.source?` · <a href="${esc(r.source)}" target="_blank" rel="noopener">Source</a>`:"";
  el.innerHTML=`<article class="detail">
    <h2>${esc(r.name)}</h2>
    <div class="meta">${esc(ROLE_LABEL[r.role]||"")}${src}</div>
    <span class="vlabel">${esc(VERSION_NAME[version])}</span>
    <h3>Ingredients</h3><ul>${ul(v.i)}</ul>
    <h3>Steps</h3><ol>${ul(v.s)}</ol>
    <h3>Shopping list</h3><ul>${ul(v.p)}</ul>
    <button class="ghost copy" id="copyList">Copy shopping list</button>
  </article>`;
}

function search(){
  const q=$("q").value.trim().toLowerCase();
  if(!q){picks=null;renderRecs();$("status").textContent="";return}
  const words=q.split(/\s+/);
  const hits=RECIPES.filter(r=>{
    const hay=(r.name+" "+ROLE_LABEL[r.role]+" "+r.v.base.i.join(" ")).toLowerCase();
    return words.some(w=>hay.includes(w));
  });
  const pickRole=role=>hits.find(r=>r.role===role)||null;
  picks={main:pickRole("main"),side:pickRole("side"),appetizer:pickRole("appetizer")};
  renderRecs();
  $("status").textContent=hits.length?`${hits.length} matching recipe${hits.length===1?"":"s"}.`:"No matches for that yet. Try a single ingredient, like chicken or potato.";
}

document.addEventListener("click",e=>{
  const t=e.target;
  const vb=t.closest("[data-version]");
  if(vb){version=vb.dataset.version;renderVersionButtons();if(selectedId) renderDetail();return}
  if(t.matches("[data-open]")){
    e.preventDefault();
    selectedId=t.dataset.open;
    renderDetail();
    $("detail").scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(t.matches("#copyList")){
    const r=RECIPES.find(x=>x.id===selectedId);
    const v=versionFor(r,version);
    navigator.clipboard?.writeText(v.p.join("\n")).then(()=>t.textContent="Copied").catch(()=>t.textContent="Select the list to copy");
  }
});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("q").addEventListener("input",()=>{if(!$("q").value.trim()){picks=null;renderRecs();$("status").textContent=""}});

renderVersionButtons();
renderRecs();
</script>
</body>
</html>
